build-windows:
  runs-on: ubuntu-latest
  
  steps:
  - uses: actions/checkout@v4
    with:
      submodules: recursive
      
  - name: install pkgs
    run: |
      sudo apt update
      sudo apt install -y gcc-mingw-w64 libz-mingw-w64-dev g++-mingw-w64 wget unzip libsdl1.2debian libsdl1.2-dev libopenal-dev libgl1-mesa-dev zlib1g-dev libcurl4-openssl-dev unzip
  
  - name: Download and setup OpenAL (prebuilt)
    run: |
      echo "- Downloading prebuilt OpenAL Soft -"
      OPENAL_VERSION="1.23.1"
      wget "https://openal-soft.org/openal-binaries/openal-soft-${OPENAL_VERSION}-bin.zip"
      
      echo "- Unzipping OpenAL -"
      unzip "openal-soft-${OPENAL_VERSION}-bin.zip"
      
      # 设置环境变量
      echo "OPENAL_INCLUDE_DIR=${PWD}/openal-soft-${OPENAL_VERSION}-bin/include/" >> $GITHUB_ENV
      echo "OPENAL_LIBRARY=${PWD}/openal-soft-${OPENAL_VERSION}-bin/libs/Win64/OpenAL32.lib" >> $GITHUB_ENV
      
      # 从正确的路径复制 DLL（router/Win64/ 包含实际的 OpenAL32.dll）
      cp "openal-soft-${OPENAL_VERSION}-bin/router/Win64/OpenAL32.dll" .
      
      # 如果上面的路径不存在，尝试从 bin/Win64/ 复制 soft_oal.dll
      if [ ! -f "OpenAL32.dll" ]; then
        echo "Warning: router/Win64/OpenAL32.dll not found, using soft_oal.dll instead"
        cp "openal-soft-${OPENAL_VERSION}-bin/bin/Win64/soft_oal.dll" ./OpenAL32.dll
      fi
      
      echo "- OpenAL setup complete -"
      ls -la OpenAL32.dll

  - name: do cmake stuff 
    run: |
      mkdir build/
      cd build/
      echo "- Downloading SDL and CURL -"
      wget https://www.libsdl.org/release/SDL-devel-1.2.15-mingw32.tar.gz
      wget https://www.libsdl.org/release/SDL-1.2.15-win32-x64.zip
      wget https://curl.se/download/curl-8.20.0.tar.gz
      
      echo "- Unzipping libs -"
      tar -xf SDL-devel-1.2.15-mingw32.tar.gz
      unzip -u SDL-1.2.15-win32-x64.zip
      tar -xf curl-8.20.0.tar.gz

      cp SDL-1.2.15/include/SDL -r ../minecraftpe/headers/ 
      
      echo "- Building curl -"
      cd curl-8.20.0/
      ./configure --host=x86_64-w64-mingw32 --prefix=$PWD/build-win64 --enable-static --enable-shared --without-libpsl --with-schannel --disable-docs
      make -j8
      make install
      cd ..
      
      echo "start building"
      export CURDIR=$DIRSTACK
      
      cmake .. -DDYNAMICSOUNDS=ON \
        -DCMAKE_SYSTEM_NAME=Windows \
        -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
        -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
        -DCMAKE_EXE_LINKER_FLAGS="${CMAKE_EXE_LINKER_FLAGS} -static" \
        -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
        -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
        -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
        -DCURL_INCLUDE_DIR="$CURDIR/curl-8.20.0/build-win64/include/" \
        -DCURL_LIBRARY="$CURDIR/curl-8.20.0/build-win64/bin/libcurl-4.dll" \
        -DSDL_LIBRARY="$CURDIR/SDL.dll" \
        -DSDL_INCLUDE_DIR="$CURDIR/SDL-1.2.15/include/" \
        -DOPENAL_INCLUDE_DIR="${{ env.OPENAL_INCLUDE_DIR }}" \
        -DOPENAL_LIBRARY="${{ env.OPENAL_LIBRARY }}" \
        -DCMAKE_FIND_ROOT_PATH=/usr/x86_64-w64-mingw32/
      
      make -j8

      cp minecraftpe/build/minecraftpe08decomp.exe .
      cp curl-8.20.0/build-win64/bin/libcurl-4.dll .

      cp ../OpenAL32.dll .
      
  - name: upload stuff
    uses: actions/upload-artifact@v4
    with:
      name: build-windows
      path: |
        build/minecraftpe08decomp.exe
        build/SDL.dll
        build/libcurl-4.dll
        build/OpenAL32.dll
